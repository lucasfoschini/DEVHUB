# Development services only. Bound to 127.0.0.1: never reachable from the network.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: devhub
      POSTGRES_PASSWORD: devhub
      POSTGRES_DB: devhub
    ports:
      # 5433 so it does not clash with a local PostgreSQL service on 5432.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devhub -d devhub']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
