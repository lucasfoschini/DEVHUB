<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevHub — Liquid Glass 27</title><style>
*{box-sizing:border-box}body{margin:0;background:#1c2220;color:#f0f0ed;font:13px/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:7px 10px;border-radius:7px;transition:background .18s,transform .18s}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible{outline:2px solid #c6ef91;outline-offset:3px}svg{vertical-align:middle;flex-shrink:0}h1,h2,h3,p{margin:0}h1{font-size:34px;letter-spacing:-1.5px;line-height:1.15}h2{font-size:15px;letter-spacing:-.3px}h3{font-size:13px;font-weight:600}.lab{background:#222528;border-bottom:1px solid #ffffff15;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.lab strong{font-size:15px}.sub{font-size:11px;color:#a0a4a7}.row,.between{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.seg{display:flex;gap:2px;padding:3px;background:#88888816;border:1px solid #88888824;border-radius:9px}.seg button{font-size:11px;padding:5px 9px;opacity:.72}.seg button.sel{background:#88888835;opacity:1}input[type=range]{accent-color:#c6ef91;width:100px}.stage{padding:24px;background:radial-gradient(ellipse at 10% 0,#526349,transparent 55%),radial-gradient(ellipse at 100% 100%,#465259,transparent 65%),#1c2220;min-height:calc(100vh - 100px)}.window{--bg:#111214;--surface:#17191c;--raise:#24272b;--text:#f0f0ed;--muted:#9b9ea5;--border:#ffffff13;--accent:#c6ef91;--ink:#19251a;--rgb:40,45,42;--green:#8bcfa1;--shine:#ffffff24;color:var(--text);background:var(--bg);border:1px solid #ffffff35;border-radius:15px;overflow:hidden;max-width:1440px;min-height:760px;margin:auto;position:relative;container-type:inline-size;box-shadow:0 20px 65px #0005}.window.light{--bg:#f5f5f2;--surface:#fff;--raise:#e4e8e1;--text:#252b27;--muted:#626d65;--border:#1b30251c;--accent:#4d722d;--ink:#fff;--rgb:245,248,240;--green:#337447;--shine:#ffffffb0}.window.phone{max-width:390px;border-radius:29px}.window.tablet{max-width:780px;border-radius:19px}.glass{background:rgba(var(--rgb),var(--opacity));backdrop-filter:blur(24px) saturate(145%);border:1px solid var(--border);border-top-color:var(--shine);box-shadow:inset 0 1px var(--shine),0 4px 15px #00000010}.window button:hover{background:var(--raise)}.shell{display:flex;min-height:760px}.sidebar{width:208px;flex-shrink:0;padding:16px 12px;display:flex;flex-direction:column;border:0;border-right:1px solid var(--border);background-image:linear-gradient(145deg,#b3cf9f0a,transparent 45%);transition:width .2s}.lights{display:flex;gap:7px;margin:3px 5px 24px}.lights i{width:10px;height:10px;border-radius:50%}.brand{display:flex;align-items:center;gap:9px;margin:0 4px 24px}.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;flex-shrink:0;background:linear-gradient(145deg,#e7ffd1,#c6ef91 52%,#86a96c);color:#243a22;border:1px solid #efffcd66;box-shadow:inset 0 1px #fff9,inset 0 -3px 7px #3f602530}.brand strong{font-size:18px;letter-spacing:-.6px}.muted{color:var(--muted)}.tiny{font-size:11px}.workspace{padding:9px;border:1px solid var(--border);border-radius:9px;margin-bottom:14px}.avatar{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--raise);font-weight:650;flex-shrink:0}.group{color:var(--muted);font-size:10px;font-weight:600;padding:14px 8px 5px}.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;color:var(--muted);white-space:nowrap;min-height:35px}.nav button.active{background:#88888820;color:var(--text);font-weight:600;box-shadow:inset 0 1px #ffffff13}.nav button.active svg{color:var(--accent)}.foot{margin-top:auto;padding:15px 5px 0;border-top:1px solid var(--border)}.main{min-width:0;flex:1}.toolbar{height:58px;padding:0 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(var(--rgb),.15)}.pill{display:flex;align-items:center;gap:2px;border-radius:99px;padding:3px}.pill button{border-radius:99px;min-width:30px;height:30px;padding:0 9px;display:flex;align-items:center;justify-content:center;gap:5px}.content{padding:27px;animation:enter .24s ease}@keyframes enter{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.intro{margin:2px 0 24px}.intro p{margin-top:8px;color:var(--muted)}.window button.primary{background:var(--accent);color:var(--ink);padding:9px 14px;border-radius:99px;font-weight:650;white-space:nowrap}.window button.primary:hover{filter:brightness(1.08)}.secondary{background:var(--raise);border:1px solid var(--border);padding:6px 11px;border-radius:99px;white-space:nowrap;font-size:11px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--border);margin:22px 0}.metric{padding:16px 14px;border-right:1px solid var(--border);min-width:0}.metric:first-child{padding-left:0}.metric:last-child{border:0}.num{font-size:30px;letter-spacing:-1.1px;font-weight:600;font-variant-numeric:tabular-nums;margin:6px 0}.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;margin:23px 0}.sectionhead{margin-bottom:12px}.chart{width:100%;height:auto;max-height:200px;margin:9px 0}.panel{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:15px;min-width:0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}.service{padding:12px 0;border-bottom:1px solid var(--border)}.service:last-child{border:0}.uptime{display:flex;height:5px;gap:2px;margin-top:7px}.uptime i{flex:1;background:var(--green);border-radius:2px;opacity:.65}.item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--border);text-align:left;width:100%}.projecticon{width:35px;height:35px;display:grid;place-items:center;border-radius:9px;flex-shrink:0;font-size:15px;font-weight:650;color:#243025;box-shadow:inset 0 1px #ffffff40}.eventicon{width:29px;height:29px;display:grid;place-items:center;background:var(--raise);border-radius:8px;color:var(--muted);flex-shrink:0}.activity{margin:17px auto 0;width:100%;max-width:420px;border-radius:99px;padding:10px 14px}.progress{height:4px;background:#88888833;border-radius:5px;overflow:hidden;margin-top:6px}.progress i{height:100%;display:block;background:var(--accent);transition:width .3s}.dock{display:none}.field{background:var(--raise);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px;width:100%;margin:8px 0 14px}.overlay{position:absolute;inset:0;background:#0005;backdrop-filter:blur(5px);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:76px 13px 20px}.dialog{width:100%;max-width:420px;border-radius:20px;padding:19px;animation:enter .25s ease;background:rgba(var(--rgb),max(.88,var(--opacity)))}.result{display:flex;align-items:center;gap:10px;padding:11px;width:100%;text-align:left}.switch{width:36px;height:22px;border-radius:99px;background:var(--raise);padding:3px;border:1px solid var(--border)}.switch i{display:block;border-radius:50%;width:14px;height:14px;background:var(--muted);transition:transform .2s}.switch.on{background:var(--accent)}.switch.on i{transform:translateX(14px);background:var(--ink)}.terminal{background:var(--surface);border:1px solid var(--border);padding:13px;font:12px/1.9 monospace;border-radius:7px;overflow:auto}.smallside .sidebar{width:49px;padding:16px 4px}.smallside .slabel,.smallside .group,.smallside .lights{display:none}.smallside .nav button{justify-content:center}.smallside .brand{margin:0 0 20px;justify-content:center}.smallside .workspace{padding:4px;justify-content:center}.toast{position:absolute;bottom:18px;right:18px;z-index:30;background:var(--raise);border:1px solid var(--border);padding:12px 15px;border-radius:12px;max-width:85%}.footer{padding:10px 24px}.window.web .lights{display:none}.window.opaque .glass{background:var(--surface);backdrop-filter:none}.window.opaque .sidebar{background:var(--surface)}
@container(max-width:680px){.sidebar{width:49px;padding:16px 4px}.sidebar .slabel,.group,.lights{display:none}.nav button{justify-content:center}.brand{margin:0 0 20px;justify-content:center}.workspace{padding:4px;justify-content:center}.cols{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.metric:nth-child(3){padding-left:0}.content{padding:18px}.searchlabel{display:none}h1{font-size:29px}.num{font-size:25px}}
@container(max-width:425px){.sidebar{display:none}.shell{display:block;min-height:690px}.toolbar{height:53px;padding:0 13px}.content{padding:19px 15px}.dock{display:flex;justify-content:space-around;align-items:center;position:sticky;bottom:8px;margin:8px 9px 13px;border-radius:99px;padding:5px;z-index:5}.dock button{display:grid;justify-items:center;gap:3px;border-radius:99px;padding:7px;font-size:9px;color:var(--muted)}.dock button.active{background:var(--raise);color:var(--accent)}.intro{align-items:flex-start;gap:8px}.intro p{font-size:11px}}
@media(max-width:550px){.stage{padding:6px}.lab{padding:12px}.footer{padding:10px 12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(prefers-reduced-transparency:reduce){.glass{background:var(--surface);backdrop-filter:none}}
</style></head><body><div id="app"></div><script>
(()=>{const root=document.getElementById('app');const paths={home:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',folder:'<path d="M3 6h7l3 3h8v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',git:'<circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="6" cy="19" r="2.5"/><path d="M6 8v8m12-6c0 5-7 5-12 5"/>',rocket:'<path d="M8 15l-3-3 6-8 10-2-2 10-8 6Zm-3 2-3 5 5-3m6-1v4m-9-9H2"/><circle cx="15" cy="8" r="2"/>',server:'<rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h1m-1 10h1M12 7h5m-5 10h5"/>',health:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',ai:'<path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/>',book:'<path d="M4 4h6l2 2 2-2h6v15h-6l-2 2-2-2H4ZM12 6v15"/>',workflow:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M6 10v4a4 4 0 0 0 4 4h4"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/>',chart:'<path d="M4 4v16h17M9 16v-5m5 5V7m5 9V3"/>',settings:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>',terminal:'<path d="m4 6 6 6-6 6m9 0h7"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',sidebar:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>',plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="m9 6 6 6-6 6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',check:'<path d="m5 12 4 4L19 6"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};const I=(n,z=16)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]||paths.home}</svg>`;
const nav=[['home','Overview'],['folder','Projetos'],['git','Git Center'],['rocket','Deployments'],['server','Infraestrutura'],['health','Observabilidade'],['ai','AI Center'],['book','Knowledge Base'],['workflow','Automações'],['lock','Secrets Vault'],['chart','Analytics'],['settings','Configurações']];let s={page:'home',device:'desktop',light:false,glass:65,opaque:false,collapse:false,range:'7D',modal:null,local:true,flows:[true,true,false],alerts:true,deploy:72,unread:true};let projects=[{n:'Lexa',d:'Next.js · Node.js',c:'#b9c9f5',status:'Produção'},{n:'Belo Ramo CRM',d:'CRM escolar',c:'#c6ef91',status:'Em dev'},{n:'Hasty Barber',d:'API REST · PostgreSQL',c:'#e9bda1',status:'Produção'}];const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const B=(t,a,c='secondary',label='')=>`<button class="${c}" data-a="${a}" ${label?'aria-label="'+esc(label)+'"':''}>${t}</button>`;const header=(n,d,a='')=>`<div class="intro between"><div><h1>${n}</h1><p>${d}</p></div>${a}</div>`;const metric=(n,v,d)=>`<div class="metric"><div class="tiny muted">${n}</div><div class="num">${v}</div><div class="tiny muted">${d}</div></div>`;const item=(i,n,d,a='')=>`<div class="item"><span class="eventicon">${I(i,15)}</span><div class="grow"><h3>${n}</h3><div class="muted tiny">${d}</div></div>${a}</div>`;const sw=(on,a,label)=>`<button class="switch ${on?'on':''}" data-a="${a}" role="switch" aria-checked="${on}" aria-label="${label}"><i></i></button>`;
function projectRows(){return projects.map((p,i)=>`<button class="item" data-a="project:${i}"><span class="projecticon" style="background:${p.c}">${esc(p.n[0])}</span><div class="grow"><h3>${esc(p.n)}</h3><span class="tiny muted">${esc(p.d)}</span></div><span class="tiny muted">${p.status==='Produção'?'<i class="dot"></i> ':''}${p.status}</span>${I('chev',12)}</button>`).join('')}
function graph(){let a={'24H':[25,38,32,58,47,71,62,84],'7D':[20,28,24,44,38,58,49,72,64,87],'30D':[16,25,38,30,51,45,65,56,77,91]}[s.range];let p=a.map((v,i)=>`${28+i*282/(a.length-1)},${110-v}`).join(' ');return `<svg class="chart" viewBox="0 0 320 120" role="img" aria-label="Gráfico com dados fictícios">${[20,45,70,95].map((y,i)=>`<path d="M28 ${y}H310" stroke="var(--border)"/><text x="0" y="${y+3}" fill="var(--muted)" font-size="8">${[8,6,4,2][i]}k</text>`).join('')}<polygon points="28,110 ${p} 310,110" fill="var(--accent)" opacity=".06"/><polyline points="${p}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="between tiny muted"><span>${s.range==='24H'?'00h':s.range==='30D'?'Dia 01':'Seg'}</span><span>${s.range==='24H'?'12h':s.range==='30D'?'Dia 15':'Qui'}</span><span>${s.range==='24H'?'23h':s.range==='30D'?'Dia 30':'Dom'}</span></div>`}
function traffic(){return `<section><div class="between sectionhead"><h2>API requests</h2><div class="seg">${['24H','7D','30D'].map(n=>B(n,'range:'+n,s.range===n?'sel':'')).join('')}</div></div><div class="panel"><div class="muted tiny">Requisições no período · Demo</div><div class="num">${{'24H':'8.2k','7D':'42.8k','30D':'182.6k'}[s.range]}</div>${graph()}</div></section>`}
function health(){return `<section><div class="between sectionhead"><h2>System health</h2><i class="dot"></i></div><div class="panel">${[['Lexa API','99.98%'],['CRM Database','100%'],['Hasty API','99.92%']].map(n=>`<div class="service"><div class="between"><span>${n[0]}</span><span class="muted tiny">${n[1]}</span></div><div class="uptime">${Array.from({length:22},()=>'<i></i>').join('')}</div></div>`).join('')}</div></section>`}
function events(){return item('rocket','Deploy concluído','Lexa · há 12 min')+item('git','Novo commit','Hasty Barber · há 48 min')+item('ai','Sessão de desenvolvimento','Claude Code · há 1 h')}
function live(){return `<div class="activity glass row"><div class="logo" style="width:31px;height:31px;border-radius:50%">${I(s.deploy===100?'check':'rocket',17)}</div><div class="grow"><div class="between"><h3>${s.deploy===100?'Deploy concluído':'Deploying Lexa · Demo'}</h3><span class="tiny muted percent">${s.deploy}%</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.deploy}"><i style="width:${s.deploy}%"></i></div></div>${B(I('chev',14),'page:rocket','','Detalhes do deploy')}</div>`}
function content(){switch(s.page){case'home':return header('Workspace','Tudo o que você está construindo.',B(I('plus',13)+' Projeto','new','primary'))+live()+`<div class="metrics">${metric('Projetos',String(projects.length).padStart(2,'0'),'Workspace pessoal')}${metric('Uptime','99.98%','7 dias')}${metric('Latência','142ms','Resposta média')}${metric('Tokens IA','2.4M','Este mês')}</div><div class="cols">${traffic()}${health()}</div><div class="cols"><section><div class="between"><h2>Projetos recentes</h2>${B('Ver todos','page:folder')}</div>${projectRows()}</section><section><h2>Atividade</h2>${events()}</section></div><div class="between service"><span class="tiny muted">${I('terminal',14)} DevHub Local Agent · Demo</span>${B(s.local?'Conectado':'Desconectado','local')}</div>`;case'folder':return header('Projetos','Seus ambientes de desenvolvimento.',B('+ Projeto','new','primary'))+'<input class="field" id="projectsearch" placeholder="Buscar projetos..." aria-label="Buscar projetos"><div id="projects">'+projectRows()+'</div>';case'git':return header('Git Center','Repositórios e atividade.',B('Sincronizar','sync'))+projects.map((p,i)=>item('git',esc(p.n),'Branch main · Demo',B('Detalhes','project:'+i))).join('');case'rocket':return header('Deployments','Releases e builds.',B('Simular deploy','start','primary'))+live()+item('rocket','Lexa · v2.4.1','Produção · Vercel',s.deploy===100?'Concluído':'Em andamento')+item('rocket','Hasty Barber · v1.8','Produção · Demo','Concluído');case'server':return header('Infraestrutura','Servidores e recursos.')+`<div class="metrics">${metric('CPU','28%','VPS')}${metric('RAM','53%','4.2 GB')}${metric('Disco','36%','100 GB')}${metric('Docker','04','Containers')}</div>`+item('server','Oracle VPS','Ubuntu · Demo','Online')+item('server','PostgreSQL','Banco de dados','Online')+item('terminal','Docker','Local Agent',B(s.local?'Conectado':'Conectar','local'));case'health':return header('Observabilidade','Disponibilidade e desempenho.',B('Health check','sync','primary'))+`<div class="cols">${traffic()}${health()}</div><div class="terminal">[INFO] Health check passed<br>[INFO] GET /api/projects — 200<br>[INFO] Database connected</div>`;case'ai':return header('AI Center','Agentes, sessões e consumo.')+`<div class="metrics">${metric('Tokens','2.4M','Mês')}${metric('Custo','R$ 48','Estimado')}${metric('Sessões','36','Mês')}${metric('Skills','12','Demo')}</div>`+item('terminal','Claude Code','Sessões demonstrativas',B('Abrir','info:Claude Code'))+item('ai','Codex','Sessões demonstrativas',B('Abrir','info:Codex'))+item('book','Skills Manager','Inventário demonstrativo',B('Abrir','info:Skills Manager'));case'book':return header('Knowledge Base','Documentação e conhecimento.')+['MASTER_PLAN.md','ARCHITECTURE.md','CLAUDE.md','DECISOES.md'].map(n=>item('book',n,'Documento demonstrativo',B('Abrir','info:'+n))).join('');case'workflow':return header('Automações','Rotinas e workflows.')+['Health check','Deploy por push','Backup'].map((n,i)=>item('workflow',n,'Workflow demonstrativo',sw(s.flows[i],'flow:'+i,n))).join('');case'lock':return header('Secrets Vault','Credenciais fictícias.')+['DATABASE_URL','GITHUB_TOKEN','JWT_SECRET'].map(n=>item('lock',n,'••••••••••',B('Detalhes','info:'+n))).join('');case'chart':return header('Analytics','Métricas de utilização.')+traffic()+events();default:return header('Configurações','Personalize sua experiência.')+item('sun','Aparência','Tema claro',sw(s.light,'theme','Tema claro'))+item('settings','Reduzir transparência','Material opaco',sw(s.opaque,'opaque','Reduzir transparência'))+item('bell','Notificações','Alertas internos',sw(s.alerts,'alerts','Notificações'))+item('terminal','Agente local','Conexão simulada',sw(s.local,'local','Agente local'));}}
function side(){return `<aside class="sidebar glass"><div class="lights" aria-hidden="true"><i style="background:#ff6258"></i><i style="background:#ffbe30"></i><i style="background:#2bc742"></i></div><div class="brand"><span class="logo">${I('terminal',23)}</span><div class="slabel"><strong>DevHub</strong><div class="tiny muted">Developer OS</div></div></div><div class="workspace row"><span class="avatar">P</span><div class="slabel"><h3>Personal</h3><div class="tiny muted">Workspace</div></div></div><nav class="nav" aria-label="Módulos">${nav.map((n,i)=>`${[0,4,7,11].includes(i)?`<div class="group">${i===0?'Workspace':i===4?'Platform':i===7?'Tools':'System'}</div>`:''}<button class="${s.page===n[0]?'active':''}" data-a="page:${n[0]}" title="${n[1]}" aria-label="${n[1]}" ${s.page===n[0]?'aria-current="page"':''}>${I(n[0],16)}<span class="slabel">${n[1]}</span></button>`).join('')}</nav><div class="foot row"><span class="avatar">LF</span><div class="slabel"><h3>Meu workspace</h3><div class="tiny muted">Plano pessoal</div></div></div></aside>`}
function render(){root.innerHTML=`<header class="lab"><div><strong>DevHub / Glass 27</strong><div class="sub">Protótipo independente · Apple-inspired</div></div><div class="controls"><div class="seg">${[['desktop','Mac'],['web','Web'],['tablet','iPad'],['phone','iPhone']].map(n=>B(n[1],'device:'+n[0],s.device===n[0]?'sel':'')).join('')}</div><label class="row sub">Vidro <input type="range" id="glass" min="0" max="100" value="${s.glass}" aria-label="Opacidade do vidro"><span id="glassvalue">${s.glass}%</span></label>${B(s.light?'Light':'Dark','theme')}${B(s.opaque?'Opaco':'Translúcido','opaque')}</div></header><div class="stage"><div class="window ${s.device} ${s.light?'light':''} ${s.collapse?'smallside':''} ${s.opaque?'opaque':''}" style="--opacity:${.2+s.glass*.0078}"><div class="shell">${side()}<main class="main"><header class="toolbar"><div class="row"><div class="pill glass">${B(I('sidebar'),'collapse','','Alternar navegação')}</div><strong>${nav.find(n=>n[0]===s.page)[1]}</strong></div><div class="row"><div class="pill glass">${B(I('search')+'<span class="searchlabel tiny">Buscar</span>','search','','Busca global')}${B(I('bell')+(s.unread?'<span style="color:var(--accent);font-size:8px">●</span>':''),'notify','','Notificações')}</div><div class="pill glass">${B(I('settings'),'control','','Control Center')}</div></div></header><div class="content">${content()}</div></main></div><nav class="dock glass" aria-label="Navegação mobile">${nav.filter(n=>['home','folder','health','ai'].includes(n[0])).map(n=>`<button class="${s.page===n[0]?'active':''}" data-a="page:${n[0]}">${I(n[0],19)}${n[0]==='health'?'Saúde':n[1]}</button>`).join('')}${B(I('more',19)+'Mais','search','')}</nav><div class="modalmount"></div><div class="toastmount"></div></div></div><footer class="footer sub">Dados fictícios · Efeito de vidro aproximado em CSS · Nenhuma integração real · Alterações nesta sessão</footer>`;if(s.modal)modal()}
function results(q){return nav.filter(n=>n[1].toLowerCase().includes(q.toLowerCase())).map(n=>B(I(n[0])+' '+n[1],'page:'+n[0],'result')).join('')||'<div class="muted">Nenhum resultado</div>'}
function modal(){let {t,v}=s.modal,title='',body='';if(t==='search'){title='Spotlight';body=`<input class="field" id="query" placeholder="Pesquisar módulos..." aria-label="Busca global"><div id="results">${results('')}</div>`}else if(t==='control'){title='Control Center';body=item('terminal','Local Agent','Conexão de demonstração',sw(s.local,'local','Agente'))+item('bell','Notificações','Alertas internos',sw(s.alerts,'alerts','Alertas'))+item('sun','Tema claro','Aparência',sw(s.light,'theme','Tema'))+item('settings','Reduzir transparência','Material opaco',sw(s.opaque,'opaque','Reduzir transparência'))+item('rocket','Deploy','Executar simulação',B('Iniciar','start','primary'))}else if(t==='new'){title='Novo projeto';body=`<form id="newform"><label>Nome<input class="field" name="name" required placeholder="Meu projeto" maxlength="100"></label><label>Stack<input class="field" name="stack" placeholder="React · TypeScript" maxlength="150"></label><button type="submit" class="primary">Criar projeto</button></form>`}else if(t==='notify'){title='Notificações';body=events()+B('Marcar como lidas','read','primary')}else if(t==='project'){let p=projects[v];title=p.n;body=item('folder',esc(p.n),esc(p.d),p.status)+B('Abrir editor (demo)','editor','primary')}else{title=v;body='<p class="muted">Operação ilustrativa. Nenhuma integração real executada.</p>'}root.querySelector('.modalmount').innerHTML=`<div class="overlay" data-a="backdrop"><section class="dialog glass" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="between" style="margin-bottom:15px"><h2>${esc(title)}</h2><div class="pill glass">${B(I('close',14),'close','','Fechar')}</div></div>${body}</section></div>`;root.querySelector('#query, #newform input, .dialog button')?.focus()}
function toast(t){let e=root.querySelector('.toastmount');e.innerHTML=`<div class="toast" role="status">${I('check',14)} ${esc(t)}</div>`;setTimeout(()=>e.innerHTML='',2500)}let timer;function start(){clearInterval(timer);s.deploy=0;s.modal=null;s.page='rocket';render();timer=setInterval(()=>{s.deploy=Math.min(100,s.deploy+8);root.querySelectorAll('.activity .progress i').forEach(e=>e.style.width=s.deploy+'%');root.querySelectorAll('.activity .progress').forEach(e=>e.setAttribute('aria-valuenow',s.deploy));root.querySelectorAll('.activity .percent').forEach(e=>e.textContent=s.deploy+'%');if(s.deploy===100){clearInterval(timer);render();toast('Deploy de demonstração concluído.')}},450)}
root.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let [a,...r]=b.dataset.a.split(':'),v=r.join(':');switch(a){case'device':s.device=v;s.modal=null;break;case'page':s.page=v;s.modal=null;break;case'theme':s.light=!s.light;break;case'opaque':s.opaque=!s.opaque;break;case'collapse':if(root.querySelector('.window').clientWidth<680)s.modal={t:'search'};else s.collapse=!s.collapse;break;case'range':s.range=v;break;case'local':s.local=!s.local;break;case'alerts':s.alerts=!s.alerts;break;case'flow':s.flows[+v]=!s.flows[+v];break;case'search':case'new':case'control':case'notify':s.modal={t:a};break;case'info':s.modal={t:a,v};break;case'project':s.modal={t:a,v:+v};break;case'close':s.modal=null;break;case'backdrop':if(e.target!==b)return;s.modal=null;break;case'read':s.unread=false;s.modal=null;break;case'start':start();return;case'sync':toast('Atualização simulada.');return;case'editor':s.modal=null;render();toast('Abertura do editor simulada.');return;default:return}render()});root.addEventListener('input',e=>{if(e.target.id==='glass'){s.glass=+e.target.value;root.querySelector('.window').style.setProperty('--opacity',.2+s.glass*.0078);root.querySelector('#glassvalue').textContent=s.glass+'%'}if(e.target.id==='query')root.querySelector('#results').innerHTML=results(e.target.value);if(e.target.id==='projectsearch')root.querySelectorAll('#projects .item').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'':'none')});root.addEventListener('submit',e=>{if(e.target.id!=='newform')return;e.preventDefault();let f=new FormData(e.target),n=String(f.get('name')).trim();if(!n)return;projects.push({n,d:String(f.get('stack')).trim()||'Stack não definida',c:'#c6ef91',status:'Em dev'});s.modal=null;s.page='folder';render();toast('Projeto criado na demonstração.')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){s.modal=null;render()}if(e.key==='Enter'&&e.target.id==='query'){e.preventDefault();root.querySelector('#results button')?.click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();s.modal={t:'search'};render()}});render();})();
</script></body></html>
